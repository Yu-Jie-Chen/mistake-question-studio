name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-formulas.txt
      - name: Byte-compile helpers
        run: python -m py_compile scripts/*.py
      - name: Preflight the demo package
        run: python scripts/preflight.py examples/incline-static
      - name: Render the 3D figure spec template
        run: |
          python scripts/draw_solid.py templates/figure-spec-3d.json \
            --out /tmp/fig.png --svg /tmp/fig.svg
      - name: Smoke-test intake (contact sheet + stubs)
        run: |
          python scripts/intake.py examples/incline-static/figures/fig-1.before.png \
            --id ci-smoke-001 --subject physics --grade "Grade 10" --work /tmp/work
          python scripts/run.py status /tmp/work/ci-smoke-001
      - name: Validate the demo package
        run: python scripts/validate_package.py examples/incline-static/question.json --root examples/incline-static
      - name: Render the demo card with formulas and DOCX
        run: |
          python scripts/build_card.py examples/incline-static/question.json \
            --out /tmp/card.md --question-out /tmp/question.md \
            --docx /tmp/card.docx --formula-mode both --strict
      - name: Build the demo index
        run: python scripts/build_index.py examples --out /tmp/index.md
